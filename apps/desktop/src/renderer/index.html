<!doctype html>
<html lang="tr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!--
      connect-src has to be explicit: without it every fetch falls back to default-src 'self', which
      is the dev server origin (or file:// in the packaged app) and therefore blocks the Supabase REST
      calls the renderer makes. The localhost entries are the dev server and its HMR socket only.
      img-src allows any https source since 0038, because an admin can point a badge icon at their own
      artwork; images are passive content here, and only https is accepted (badgeIconSrc rejects http).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co ws://localhost:* http://localhost:*; font-src 'self' data:"
    />
    <title>TDS Companion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
